name: Mobile scene textures
on:
  push:
    branches: [web/mobile-window-light-textures]
permissions:
  contents: write
concurrency:
  group: mobile-scenes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1 sharp@0.34.5
      - run: npx playwright install --with-deps chromium
      - run: node scripts/bake-mobile-scenes.mjs
      - run: npm run build
      - run: node scripts/test-mobile-scenes.mjs
      - name: Save verified textures to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mobile artifacts/mobile-scenes
          if ! git diff --cached --quiet; then
            git commit -m "Add baked mobile textures and verification screenshots [skip ci]"
            git push origin HEAD:web/mobile-window-light-textures
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-scenes-preview
          path: |
            artifacts/mobile-scenes/
            public/mobile/
            dist/client/
