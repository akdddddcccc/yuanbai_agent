<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><title>元白模型状态检查</title>
<style>body{margin:0;background:#180506;color:#fff;font-family:sans-serif}#controls{position:fixed;top:12px;left:12px;z-index:10}button{padding:12px;margin:4px}.scene-mount canvas{display:block;width:100%;height:100%}.scene-mount{width:100vw;height:100vh}</style>
<div id="controls"><button id="idle">静置</button><button id="speaking">模拟语音</button><button id="thinking">思考粒子</button><span id="status">静置</span></div><div id="root"></div>
<script>
if (location.protocol === 'file:') {
  document.getElementById('controls').innerHTML = '<h2>请先启动本地模型预览</h2><p>双击同一文件夹中的 Start-Model.cmd，模型就会在浏览器中打开。</p><p>已启动的话，<a style="color:#ffbb88" href="http://127.0.0.1:5187/model-check.html">点击这里查看模型</a>。</p><p>这个 HTML 不能直接以文件方式加载 3D 资源。</p>';
}
</script>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {YuanbaiScene} from './src/YuanbaiScene.js';
const root=createRoot(document.getElementById('root'));
let phase='idle';
for(const id of ['idle','speaking','thinking']) document.getElementById(id).onclick=()=>{phase=id;document.getElementById('status').textContent=id;};
function frame(t){root.render(React.createElement(YuanbaiScene,{phase,level:phase==='speaking'?.3+.25*Math.sin(t/180):0}));requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></html>
