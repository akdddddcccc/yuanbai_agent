# Enable this server only after obtaining an IP-address certificate.
# Keep any existing port 80 website; add the challenge location there separately.
server {
    listen 443 ssl;
    server_name 123.56.162.88;

    ssl_certificate /etc/letsencrypt/live/123.56.162.88/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.56.162.88/privkey.pem;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /api/yuanbai/game/ {
        client_max_body_size 200k;
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4174;
    }

    location / { return 404; }
}
