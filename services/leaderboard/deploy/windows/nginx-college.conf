# Template only. Add inside the verified college HTTPS server block (or its
# existing trusted TLS-termination route), never replace the complete nginx.conf.
# Replace D:/yuanbai with the actual extraction directory. Verify port 4174 first.
# Keep the existing root, /videoSys/, /ftp/, 8080 and 8083 services intact.

location = /yuanbai/explore { return 301 /yuanbai/explore/; }
location ^~ /yuanbai/explore/ {
    alias D:/yuanbai/public/explore/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
}
location = /yuanbai/portal-navigation.css {
    alias D:/yuanbai/public/portal-navigation.css;
}

# Preserve the /api/yuanbai/game/ path: proxy_pass intentionally has NO trailing /.
location ^~ /api/yuanbai/game/ {
    proxy_pass http://127.0.0.1:4174;
    proxy_http_version 1.1;
    client_max_body_size 200k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}

# Do NOT expose the bundle root: data/, backups/, services/ and runtime/
# must never be mapped into a public static route.
