# Include INSIDE the existing server {} for the college hostname.
# Replace the existing /yuanbai/ location. Do not add duplicates.
# Keep the current /api/yuanbai/game/ block and database/service unchanged.
location = /yuanbai { return 302 /yuanbai/$is_args$args; }
location ^~ /yuanbai/ {
    alias D:/yuanbai/releases/v7/public/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
}
location = /api/yuanbai/chat {
    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}
location ~ ^/api/yuanbai/voice-queue/(join|status|release)$ {
    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
# Never expose internal claim/complete operations.
location /api/yuanbai/voice-queue/ { return 404; }
