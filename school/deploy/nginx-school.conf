# Incremental template. Replace matching game locations in the existing server;
# never replace the entire nginx.conf, and do not add duplicate locations.
# Use the actual verified hostname/origin, installation directory and free port.
# Existing 8080/8083 services stay on their own routes.

location = /yuanbai { return 301 /yuanbai/; }
location = /yuanbai/explore { return 301 /yuanbai/explore/; }
location = /yuanbai/tutorial { return 301 /yuanbai/tutorial/; }
location ^~ /yuanbai/ {
    alias D:/yuanbai-school/public/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
}

# Remove the previous /yuanbai/explore/ alias if it still points to the old build.
# Replace any proxy to the personal website with this local school service.
location ^~ /api/yuanbai/game/ {
    proxy_pass http://127.0.0.1:4174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 200k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;
}

# Map ONLY public/. Never expose data/, backups/, runtime/, deploy/ or services/.
# If HTTPS ends at an upstream gateway, forward both the page and API paths there.
# Keep the browser's original Origin; the backend checks the exact siteOrigin.
